  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'cyber-lime': '#d4ff00',
            'cyber-lime-dark': '#b3d900',
            'dark-bg': '#070709',
            'dark-surface': '#0e0e13',
            'dark-elevated': '#161620',
            'emerald-accent': '#10b981'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'neon-lime': '0 0 50px -12px rgba(212, 255, 0, 0.25)',
            'neon-lime-lg': '0 0 80px -15px rgba(212, 255, 0, 0.4)',
            'neon-emerald': '0 0 50px -12px rgba(16, 185, 129, 0.3)',
            'glass': '0 20px 48px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1)'

            'aurora-wave': 'auroraMove 12s ease infinite alternate',

            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.08)' }

            auroraMove: {
              '0%': { transform: 'translate(0, 0) scale(1) rotate(0deg)' },
              '50%': { transform: 'translate(4%, 3%) scale(1.1) rotate(3deg)' },
              '100%': { transform: 'translate(-3%, -2%) scale(1.05) rotate(-2deg)' }
            }
          }
        }
      }
    };

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* Custom Scrollbar & Selection */
    ::-webkit-scrollbar {
      width: 7px;
    }

    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4ff00;
    }
    ::selection {
      background-color: #d4ff00;

    /* Aurora Fluid Hero Background with mix-blend-screen */
    .aurora-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140vw;
      max-width: 1800px;
      height: 750px;
      pointer-events: none;
      overflow: hidden;

      top: -15%;

      height: 480px;
      background: radial-gradient(circle, rgba(212, 255, 0, 0.28) 0%, rgba(212, 255, 0, 0.05) 50%, transparent 70%);

</head>

    // --- Component 1: Floating Header / Navbar ---
    const Navbar = () => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className="fixed top-0 left-0 right-0 z-50 flex justify-center pt-4 px-4 pointer-events-none">
          <nav
            className={`pointer-events-auto flex items-center justify-between w-full max-w-6xl px-4 md:px-6 py-3 rounded-full border transition-all duration-300 ${
              isScrolled
                ? 'bg-zinc-950/80 backdrop-blur-2xl border-white/15 shadow-2xl shadow-black/80'
                : 'bg-zinc-900/40 backdrop-blur-xl border-white/10'

            {/* Logo */}
            <a href="#hero" className="flex items-center gap-2.5 group">

                  </span>
                </div>
              </div>
            </a>

            {/* Desktop Navigation Links */}

              <a href="#micro-erp" className="hover:text-cyber-lime transition-colors">Micro-ERP</a>
              <a href="#servicios-medida" className="hover:text-cyber-lime transition-colors">Servicios a Medida</a>
              <a href="#planes" className="hover:text-cyber-lime transition-colors">Planes</a>
              <a href="#fundadores" className="hover:text-cyber-lime transition-colors">Fundadores</a>

                <div className="flex items-center justify-between text-xs font-mono text-zinc-400 mb-2">
                  <span className="text-cyber-lime font-bold">NODE_01</span>
                  <Icon name="wifi" className="w-4 h-4 text-cyber-lime" />
                </div>
                <div className="font-bold text-white text-sm mb-1">Mesa 04 (Toque NFC)</div>
                <div className="text-[11px] text-zinc-400 font-mono">ID: nfc-m04-surco</div>
                <div className="mt-3 text-[10px] bg-black/60 px-2 py-1 rounded text-zinc-300 flex items-center gap-1 border border-white/5">
                  <span className="w-1.5 h-1.5 rounded-full bg-cyber-lime"></span>
                  <span>Sin instalar apps</span>

              {/* Node 2: Central WhatsApp Bot IA Orchestrator */}

                activeStep === 2

                <div className="text-base font-extrabold text-white mb-1 flex items-center gap-2">
                  <Icon name="messageCircle" className="w-5 h-5 text-emerald-400" />
